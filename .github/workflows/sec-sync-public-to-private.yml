name: 'Security: Sync from Public'
on:
  workflow_dispatch:
    inputs:
      force:
        description: Sync even if private is ahead (for conflict recovery)
        type: boolean
        default: true
jobs:
  sync-from-public:
    if: github.repository == 'n8n-io/n8n-private'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Generate App Token
      id: app-token
      uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf
      with:
        app-id: ${{ secrets.N8N_ASSISTANT_APP_ID }}
        private-key: ${{ secrets.N8N_ASSISTANT_PRIVATE_KEY }}
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        fetch-depth: 0
        token: ${{ steps.app-token.outputs.token }}
    - name: Sync master from public
      run: "git fetch https://github.com/n8n-io/n8n.git master:public-master\n\n#\
        \ Check if private is ahead of public, ignore Bundle commits\nAHEAD_COUNT=$(git\
        \ rev-list public-master..HEAD --pretty=oneline --grep=\"chore: Bundle\" --invert-grep\
        \ --count)\n\nif [ \"$AHEAD_COUNT\" -gt 0 ]; then\n  if [ \"${{ github.event_name\
        \ }}\" = \"schedule\" ]; then\n    echo \"Private is $AHEAD_COUNT commit(s)\
        \ ahead of public, skipping scheduled sync\"\n    exit 0\n  elif [ \"${{ inputs.force\
        \ }}\" != \"true\" ]; then\n    echo \"Private is $AHEAD_COUNT commit(s) ahead\
        \ of public, skipping (force not enabled)\"\n    exit 0\n  else\n    echo\
        \ \"Private is $AHEAD_COUNT commit(s) ahead of public, force syncing anyway\"\
        \n  fi\nfi\n\ngit reset --hard public-master\ngit push origin master --force-with-lease\n"
    - name: Sync 1.x from public
      run: "git fetch https://github.com/n8n-io/n8n.git 1.x:public-1.x\ngit checkout\
        \ 1.x\n\n# Check if private is ahead of public, ignore Bundle commits\nAHEAD_COUNT=$(git\
        \ rev-list public-1.x..HEAD --pretty=oneline --grep=\"chore: Bundle\" --invert-grep\
        \ --count)\n\nif [ \"$AHEAD_COUNT\" -gt 0 ]; then\n  if [ \"${{ github.event_name\
        \ }}\" = \"schedule\" ]; then\n    echo \"Private 1.x is $AHEAD_COUNT commit(s)\
        \ ahead of public, skipping scheduled sync\"\n    exit 0\n  elif [ \"${{ inputs.force\
        \ }}\" != \"true\" ]; then\n    echo \"Private 1.x is $AHEAD_COUNT commit(s)\
        \ ahead of public, skipping (force not enabled)\"\n    exit 0\n  else\n  \
        \  echo \"Private 1.x is $AHEAD_COUNT commit(s) ahead of public, force syncing\
        \ anyway\"\n  fi\nfi\n\ngit reset --hard public-1.x\ngit push origin 1.x --force-with-lease\n"
    - name: Ensure bundle/2.x exists
      run: "if git ls-remote --exit-code origin refs/heads/bundle/2.x; then\n  echo\
        \ \"bundle/2.x already exists, skipping\"\nelse\n  echo \"bundle/2.x not found,\
        \ creating from master\"\n  git checkout master\n  git checkout -b bundle/2.x\n\
        \  git push origin bundle/2.x\nfi\n"
    - name: Ensure bundle/1.x exists
      run: "if git ls-remote --exit-code origin refs/heads/bundle/1.x; then\n  echo\
        \ \"bundle/1.x already exists, skipping\"\nelse\n  echo \"bundle/1.x not found,\
        \ creating from 1.x\"\n  git checkout 1.x\n  git checkout -b bundle/1.x\n\
        \  git push origin bundle/1.x\nfi\n"
