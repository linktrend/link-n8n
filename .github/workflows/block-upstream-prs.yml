name: Block upstream PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  block-upstream-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Reject non-link-n8n base or n8n-io/n8n head
        env:
          BASE_REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          if [ "${BASE_REPO}" != "linktrend/link-n8n" ]; then
            echo "PR base must be linktrend/link-n8n (got ${BASE_REPO})."
            exit 1
          fi
          if [ "${HEAD_REPO}" = "n8n-io/n8n" ]; then
            echo "PRs from n8n-io/n8n are blocked. Sync upstream into development instead."
            exit 1
          fi
          echo "PR source ${HEAD_REPO} -> ${BASE_REPO} is allowed."
