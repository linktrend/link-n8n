# Dependabot version updates for this fork.
# Security alerts still scan the default branch (main); keep development current
# and promote via LiNKtrend lifecycle so alerts clear.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: development
    open-pull-requests-limit: 25
    schedule:
      interval: weekly
      day: monday
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
      production-minor:
        dependency-type: production
        update-types:
          - minor
          - patch
